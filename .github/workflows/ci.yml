name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  windows-offline-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned test prerequisites
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          python -m pip install --disable-pip-version-check paramiko==5.0.0

      - name: Install Codex-Admin in an isolated fixture
        shell: pwsh
        env:
          CODEX_ADMIN_SITE_ROOT: ${{ runner.temp }}\codex-admin-site
          LOCALAPPDATA: ${{ runner.temp }}\codex-admin-local
        run: |
          .\scripts\Install-CodexAdmin.ps1 -SiteRoot $env:CODEX_ADMIN_SITE_ROOT

      - name: Run offline project tests
        shell: pwsh
        env:
          CODEX_ADMIN_SITE_ROOT: ${{ runner.temp }}\codex-admin-site
          LOCALAPPDATA: ${{ runner.temp }}\codex-admin-local
        run: |
          .\scripts\Test-CodexAdminPublicProject.ps1 -SkipCleanClone

      - name: Scan complete Git history
        shell: pwsh
        run: |
          .\scripts\Test-CodexAdminGitHistory.ps1
